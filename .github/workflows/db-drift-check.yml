name: DB Migration Drift Check
# Fails CI when a migration is committed to supabase/migrations/ but never applied
# to the database. Read-only — never modifies the database.

on:
  push:
    branches: [master]
    paths: ['supabase/migrations/**']
  pull_request:
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client
        run: npm install @supabase/supabase-js@^2 --no-save

      - name: Check migration drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/check-migration-drift.mjs
